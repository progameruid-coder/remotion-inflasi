name: Render Video Remotion

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Render Video MP4
        run: npm run build

      - name: Simpan Hasil Video
        uses: actions/upload-artifact@v4
        with:
          name: video-inflasi-mp4
          path: out/inflasi-video.mp4
